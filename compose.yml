services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CodeHuntDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app-db-data:/var/lib/postgresql

  rustfs:
    image: &rustfs-image rustfs/rustfs:1.0.6
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-codehunt}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-codehunt-local-password}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app-rustfs-data:/data

  # Однократно создаёт приватный бакет; повторный запуск сохраняет файлы.
  rustfs-init:
    image: *rustfs-image
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-codehunt}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-codehunt-local-password}
      S3_BUCKET: ${S3_BUCKET:-codehunt}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rc alias set storage http://rustfs:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        rc bucket create --ignore-existing "storage/$$S3_BUCKET"

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health-check/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: ${PROJECT_NAME:-CodeHunt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:-CodeHuntDB}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-codehunt}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-codehunt-local-password}
      S3_BUCKET: ${S3_BUCKET:-codehunt}
      S3_REGION: ${S3_REGION:-us-east-1}

  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark
      ADMINER_DEFAULT_SERVER: db

volumes:
  app-db-data:
  app-rustfs-data:
